# PPO Hyperparameters for AckBot Target Following (Recurrent Spatial PPO)
algorithm:
  total_timesteps: 1500000      # Extended environment steps across 7-stage curriculum
  num_envs: 8                   # Parallel environments per rollout
  n_steps: 512                  # Rollout horizon per env (8 * 512 = 4096 transitions/iter)
  seq_len: 64                   # Sequence chunk length for recurrent GRU BPTT (3.2 s)
  num_mini_batches: 8           # Minibatches per epoch
  batch_size: 128               # Fallback flat minibatch size (single-env / tests)
  n_epochs: 6                   # PPO update epochs per iteration
  learning_rate: 0.0003         # Adam optimizer learning rate
  gamma: 0.99                   # Discount factor
  gae_lambda: 0.95              # GAE factor
  clip_range: 0.2               # PPO surrogate clip epsilon
  clip_range_vf: 5.0            # Value function clip epsilon
  ent_coef: 0.001               # Entropy bonus coefficient (prevents logstd inflation)
  vf_coef: 0.05                 # Balanced against O(100) squared return scale
  max_grad_norm: 0.5            # Gradient clipping norm
  target_kl: 0.03               # Target KL divergence threshold for early stopping

curriculum:
  enabled: true
  min_episodes_per_stage: 35
  stage_thresholds:
    1: { min_return: 750.0 }
    2: { min_return: 550.0 }
    3: { min_return: 1100.0 }
    4: { min_return: 850.0 }
    5: { min_return: 850.0 }
    6: { min_return: 750.0 }
  replay_previous_ratio: 0.45

evaluation:
  eval_freq: 36864              # Evaluate every 12 iters (~36.8k steps)
  n_eval_episodes: 3            # Number of deterministic test episodes per stage
  save_best_only: false

runtime:
  vec_env: "sync"               # "sync" or "async" (spawn-safe for Linux & macOS)
  torch_threads: "auto"         # "auto" or integer (prevents CPU oversubscription on 6-core VM)

device: "auto"                  # auto, mps, cpu, cuda
