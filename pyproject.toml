[project]
name = "ackerman-follow"
version = "0.1.0"
description = "MuJoCo-based 4-wheel Ackermann robot target-following with Recurrent Spatial PPO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.0.0",
    "mujoco>=3.2.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "tensorboard>=2.16.0",
    "torch>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
ackerman-train-ppo = "scripts.train_ppo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ackerman_follow", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
